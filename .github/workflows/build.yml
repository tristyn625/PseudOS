
name: Build PseudOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build minimal Debian-based ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes live-build debootstrap xorriso squashfs-tools

      - name: Configure and build PseudOS
        run: |
          mkdir build
          cd build

          sudo lb config \
            --distribution trixie \
            --architecture amd64 \
            --binary-images iso-hybrid \
            --debian-installer none \
            --archive-areas "main" \
            --bootappend-live "boot=live components"

          sudo lb build

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: PseudOS-minimal-amd64
          path: build/live-image-amd64.hybrid.iso
          if-no-files-found: error
          retention-days: 7
