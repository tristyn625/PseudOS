
name: Build PseudOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build minimal Debian-based ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes live-build debootstrap xorriso squashfs-tools debian-archive-keyring

      - name: Configure and build PseudOS
        run: |
          mkdir build
          cd build

          sudo lb config \
            --ignore-system-defaults \
            --mode debian \
            --distribution trixie \
            --architecture amd64 \
            --binary-images iso-hybrid \
            --debian-installer none \
            --archive-areas main \
            --security false \
            --mirror-bootstrap https://deb.debian.org/debian/ \
            --mirror-chroot https://deb.debian.org/debian/ \
            --mirror-binary https://deb.debian.org/debian/ \
            --bootappend-live "boot=live components"

          sudo mkdir -p config/archives

          printf '%s\n' \
            'deb https://security.debian.org/debian-security trixie-security main' \
            | sudo tee config/archives/security.list.chroot > /dev/null

          printf '%s\n' \
            'deb https://security.debian.org/debian-security trixie-security main' \
            | sudo tee config/archives/security.list.binary > /dev/null

          sudo lb build

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: PseudOS-minimal-amd64
          path: build/live-image-amd64.hybrid.iso
          if-no-files-found: error
          retention-days: 7
