name: Build PseudOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      keep_iso:
        description: Keep the ISO as a downloadable workflow artifact
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pseudos-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, install-test, and verify PseudOS
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      LINUXLIVE_REPOSITORY: https://github.com/Eric-Ness/linuxlive
      LINUXLIVE_REF: fda95dd28424064f70347481fa6ee5b3b989dcd1
      SPEC: linuxlive.yaml
      ISO: build/PseudOS-0.1.0-amd64.iso
      RESULTS: build/results

    steps:
      - name: Check out PseudOS
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install artwork-generation dependency
        run: python -m pip install Pillow

      - name: Generate original PseudOS artwork
        run: python scripts/make_art.py

      - name: Fetch the pinned live-ISO build engine
        run: |
          git clone --filter=blob:none "$LINUXLIVE_REPOSITORY" builder/linuxlive
          git -C builder/linuxlive checkout --detach "$LINUXLIVE_REF"
          test "$(git -C builder/linuxlive rev-parse HEAD)" = "$LINUXLIVE_REF"

      - name: Install build-engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r builder/linuxlive/requirements.txt
          python -m pip install -e builder/linuxlive

      - name: Extend the build engine with XFCE support
        run: |
          python scripts/patch-linuxlive.py builder/linuxlive
          python -m py_compile scripts/patch-linuxlive.py scripts/make_art.py
          bash -n scripts/first-login.sh
          python -m compileall -q builder/linuxlive/linuxlive
          python -m linuxlive validate --online "$SPEC"
          python -m linuxlive compile "$SPEC" -o build/ctx

      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install ISO and virtual-machine tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf squashfs-tools xorriso \
            grub-pc-bin grub-common mtools dosfstools
          podman --version
          qemu-system-x86_64 --version | head -n 1

      - name: Enable KVM when the runner exposes it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo "::warning::KVM is unavailable; QEMU will use software emulation."
          fi

      - name: Build the Ubuntu 26.04 + XFCE image
        run: |
          BUILD_ID="$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          sudo podman build --pull=newer --tag localhost/pseudos:ci \
            --build-arg "LL_BUILD_ID=$BUILD_ID" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            build/ctx

      - name: Assemble the hybrid live ISO
        id: assemble
        run: |
          mkdir -p build "$RESULTS"
          sudo LL_SQUASHFS_LEVEL=9 LL_RMI_AFTER=1 \
            bash builder/linuxlive/scripts/assemble-iso.sh \
            build/ctx localhost/pseudos:ci "$ISO"
          sudo chown "$(id -u):$(id -g)" "$ISO" "$ISO.sha256" "$ISO.packages"
          ls -lh "$ISO" "$ISO.sha256" "$ISO.packages"
          (cd build && sha256sum --check "$(basename "$ISO").sha256")
          python -m linuxlive inspect-iso "$ISO" --json "$RESULTS/iso.json" > /dev/null

      - name: Prepare verification metadata
        run: |
          python - <<'PY'
          import json, os, subprocess
          meta = {
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "build_id": os.environ["BUILD_ID"],
              "base": "ubuntu",
              "arch": "amd64",
              "spec": os.environ["SPEC"],
              "linuxlive": {
                  "repository": os.environ["LINUXLIVE_REPOSITORY"],
                  "ref": os.environ["LINUXLIVE_REF"],
                  "commit": subprocess.check_output(
                      ["git", "-C", "builder/linuxlive", "rev-parse", "HEAD"], text=True
                  ).strip(),
              },
          }
          with open(os.path.join(os.environ["RESULTS"], "meta.json"), "w", encoding="utf-8") as f:
              json.dump(meta, f, indent=2)
          PY

      - name: Boot-test UEFI from USB and start XFCE
        run: |
          python builder/linuxlive/scripts/boottest.py \
            --arch amd64 --iso "$ISO" --mode uefi-usb --session \
            --out "$RESULTS/modes/uefi-usb" || true

      - name: Boot-test Secure Boot, UEFI CD, and BIOS modes
        run: |
          if grep -q LINUXLIVE_BOOTCHECK_START "$RESULTS/modes/uefi-usb/serial.log" 2>/dev/null; then
            for mode in uefi-sb-cd uefi-cd bios-cd bios-usb; do
              python builder/linuxlive/scripts/boottest.py \
                --arch amd64 --iso "$ISO" --mode "$mode" \
                --out "$RESULTS/modes/$mode" || true
            done
          else
            echo "::error::The first boot did not reach userspace; skipped the remaining firmware tests."
          fi

      - name: Test USB persistence across two boots
        run: |
          if ! grep -q LINUXLIVE_SESSION_READY "$RESULTS/modes/uefi-usb/serial.log" 2>/dev/null; then
            echo "::error::The live desktop did not start; skipped persistence testing."
            exit 0
          fi
          cp --sparse=always "$ISO" build/pseudos-stick.img
          truncate -s 8G build/pseudos-stick.img
          python builder/linuxlive/scripts/boottest.py \
            --arch amd64 --iso "$ISO" --mode persist-1 \
            --disk build/pseudos-stick.img --session \
            --out "$RESULTS/modes/persist-1" || true
          python builder/linuxlive/scripts/boottest.py \
            --arch amd64 --iso "$ISO" --mode persist-2 \
            --disk build/pseudos-stick.img --session \
            --out "$RESULTS/modes/persist-2" || true
          rm -f build/pseudos-stick.img

      - name: Test installation in a disposable virtual disk
        run: |
          if ! grep -q LINUXLIVE_SESSION_READY "$RESULTS/modes/uefi-usb/serial.log" 2>/dev/null; then
            echo "::error::The live desktop did not start; skipped install testing."
            exit 0
          fi
          qemu-img create -f qcow2 build/pseudos-install-test.qcow2 64G
          python builder/linuxlive/scripts/boottest.py \
            --arch amd64 --iso "$ISO" --mode install \
            --disk build/pseudos-install-test.qcow2 \
            --out "$RESULTS/modes/install" || true
          if grep -q LINUXLIVE_INSTALLED "$RESULTS/modes/install/serial.log" 2>/dev/null; then
            python builder/linuxlive/scripts/boottest.py \
              --arch amd64 --iso "$ISO" --mode installed-uefi-sb \
              --disk build/pseudos-install-test.qcow2 --session \
              --out "$RESULTS/modes/installed-uefi-sb" || true
            python builder/linuxlive/scripts/boottest.py \
              --arch amd64 --iso "$ISO" --mode installed-bios \
              --disk build/pseudos-install-test.qcow2 \
              --out "$RESULTS/modes/installed-bios" || true
          else
            echo "::error::The unattended installer did not complete."
          fi
          rm -f build/pseudos-install-test.qcow2

      - name: Verify ISO, firmware modes, XFCE session, installer, and persistence
        run: |
          python -m linuxlive verify-results \
            --spec "$SPEC" --results "$RESULTS" \
            --expect-commit "$GITHUB_SHA" | tee build/verify.txt
          touch build/verification-passed

      - name: Upload ISO, checksum, and package manifest
        if: always() && steps.assemble.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.keep_iso)
        uses: actions/upload-artifact@v7
        with:
          name: PseudOS-0.1.0-amd64
          path: |
            build/PseudOS-0.1.0-amd64.iso
            build/PseudOS-0.1.0-amd64.iso.sha256
            build/PseudOS-0.1.0-amd64.iso.packages
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Upload boot-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: PseudOS-build-diagnostics
          path: |
            build/results
            build/verify.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Build summary
        if: always()
        run: |
          {
            echo "## PseudOS build"
            if [ -f build/verification-passed ]; then
              echo "PseudOS was built, boot-tested, install-tested, and verified."
            elif [ -f "$ISO" ]; then
              echo "The ISO was assembled, but one or more tests failed. Download the diagnostics artifact."
            else
              echo "The ISO build did not complete. Open the failed workflow step for the exact error."
            fi
            if [ -f "$ISO" ]; then
              echo
              echo "ISO size: $(du -h "$ISO" | cut -f1)"
              echo "SHA-256: $(sha256sum "$ISO" | cut -d' ' -f1)"
            fi
            if [ -f build/verify.txt ]; then
              echo
              echo '```'
              cat build/verify.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
